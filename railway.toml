# Railway 部署配置
# Railway.app 会自动检测此文件并部署

[build]
builder = "nixpacks"

[deploy]
startCommand = "cd backend && uv run uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[env]
# 数据库配置（Railway 会自动提供 PostgreSQL）
DATABASE_URL = { reference = "DATABASE_URL" }
NEO4J_URI = "bolt://localhost:7687"
NEO4J_USER = "neo4j"
NEO4J_PASSWORD = "tcm_graph_2026"
JWT_SECRET_KEY = { reference = "JWT_SECRET_KEY" }
DEEPSEEK_API_KEY = { reference = "DEEPSEEK_API_KEY" }
CORS_ORIGINS = "*"
